# FastPig 知识库受控词表（默认模板）
# 首次使用时复制到 notes/_kb/taxonomy.yaml，之后以该文件为准，随笔记一起云同步。
# 格式：domains 下每个 domain 有 name、topics，可选 aliases（topic 名 -> 别名列表）。
# 匹配按书写顺序进行，先命中的优先：技术类在前，工作管理/个人在后，
# 这样"面试大数据工程师"落到面试，"sparksql"落到 Spark 而不是 SQL。
# 这里只放通用词；公司名、项目代号等私有别名请写进本地 notes/_kb/taxonomy.yaml。
version: 1
domains:
  - name: 大数据
    topics: [Spark, Hive, Flink, Kafka, Paimon, SeaTunnel, DolphinScheduler, Superset, DataWorks, MaxCompute, ZooKeeper, 数仓建模, 数据治理, 数据湖, 数据中台, 分布式理论]
    aliases:
      Spark: [rdd, dataframe, sparksql, pyspark]
      Hive: [hql, beeline, hiveserver]
      Flink: [flinksql, checkpoint, watermark]
      Kafka: [kafka, 消息队列, rabbitmq, 分区副本]
      Paimon: [paimon, 湖仓]
      SeaTunnel: [seatunnel, 数据集成]
      DolphinScheduler: [dolphinscheduler, 调度工作流]
      Superset: [superset, 可视化]
      MaxCompute: [odps]
      数仓建模: [数仓, 维度建模, 宽表, 拉链表, 数据建模, 数据仓库]
      数据治理: [数据质量, 元数据, openmetadata, 数据标准]
      数据湖: [数据湖, iceberg, hudi]
      数据中台: [中台, 数据平台]
  - name: 数据库
    topics: [MySQL, StarRocks, PostgreSQL, Redis, MongoDB, ClickHouse, SQL, 数据库基础]
    aliases:
      MySQL: [innodb, mysqldump, binlog]
      StarRocks: [olap, 物化视图]
      PostgreSQL: [postgres, pgsql]
      Redis: [redis, 缓存穿透]
      MongoDB: [mongo, 文档数据库]
      ClickHouse: [clickhouse, 列式存储]
      SQL: [sql语句, sql优化, 索引失效, 执行计划]
      数据库基础: [数据库常识, 数据库原理, 事务隔离]
  - name: 运维
    topics: [Linux, 网络, Docker, Nginx, MinIO, Terraform, Jenkins, 云平台, Windows, 服务器配置]
    aliases:
      Linux: [shell, bash, centos, ubuntu, systemd, crontab]
      网络: [tcp, dns, iptables, 抓包]
      Docker: [容器, dockerfile, compose, k8s, kubernetes]
      Nginx: [nginx, 反向代理]
      MinIO: [minio, 对象存储]
      Terraform: [terraform, 基础设施即代码]
      Jenkins: [jenkins, jekins, cicd, 流水线]
      云平台: [aws, 阿里云, aliyun, 腾讯云, 华为云]
      Windows: [windows, 批处理, powershell, 注册表]
      服务器配置: [服务器配置, 服务部署, 安装部署]
  - name: 编程语言
    topics: [Java, Python, Git, Markdown, 设计模式, 数据结构与算法, 面向对象, 嵌入式, MQL5, 数学]
    aliases:
      Java: [jvm, maven, spring, jdbc, gradle]
      Python: [pip, pandas, conda, virtualenv, uv包]
      Git: [git, github, 版本管理]
      Markdown: [markdown, 语法速查]
      设计模式: [设计模式, 单例, 工厂模式]
      数据结构与算法: [数据结构, 算法, 复杂度]
      面向对象: [面向对象, 封装继承, 多态]
      嵌入式: [mcu, 单片机, 嵌入式, 按键精灵]
      MQL5: [mql5, 外汇量化]
      数学: [数学, 公式, latex]
  - name: AI
    topics: [大模型, Dify, Agent, 智能客服, AI应用]
    aliases:
      大模型: [llm, 大模型, 提示词, prompt, 准确度]
      Dify: [dify]
      Agent: [agent, byterover, bytervoer, mcp, 记忆库]
      智能客服: [智能客服, 客服机器人]
      AI应用: [ai应用, ai工具]
  - name: 工作管理
    topics: [工作日志, 待办, 会议, 项目, 面试, 培训, 办公]
    aliases:
      工作日志: [日报, 周报, 工作周志]
      待办: [todo, 计划清单]
      会议: [评审, 纪要]
      项目: [项目, 工作笔记, 工作介绍, 业务, 项目管理]
      面试: [面试, 面试题, 求职, 简历]
      培训: [培训, 教程, 学习资源]
      办公: [ppt, excel, word, 演示文稿]
  - name: 个人
    topics: [随笔, 日记, 读书, 人生规划, 投资, 健康, 育儿, 创作]
    aliases:
      随笔: [随想, 感想, 话术, 感悟]
      读书: [读书, 书籍, 知识收集]
      人生规划: [人生规划, 规划, 觉醒]
      投资: [股票, 基金, 外汇, 买房, 投资]
      健康: [咳嗽, 养生, 就医, 跑步, 长跑, 运动]
      育儿: [婴儿, 喂养, 宝宝]
      创作: [专利, 构思, 写作]
  - name: 待分类
    topics: [待分类]