<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070A12" />
    <meta name="description" content="FastPig 网页端 — 块级知识库工作台：拼音前缀直达、三通道混合检索、端到端加密私密笔记。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070A12'/%3E%3Cellipse cx='16' cy='18' rx='9' ry='7' fill='%2322D3EE'/%3E%3Cellipse cx='12.5' cy='18' rx='1.8' ry='2.4' fill='%23070A12'/%3E%3Cellipse cx='19.5' cy='18' rx='1.8' ry='2.4' fill='%23070A12'/%3E%3Cpath d='M6 9h6M9 6h9M14 3h8' stroke='%23A3E635' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>FastPig · 知识工作台</title>
    <script>
      // 首屏前定主题，避免深色界面闪一下白底
      try {
        var raw = localStorage.getItem('fp.theme')
        var t = raw ? JSON.parse(raw) : 'ink'
        document.documentElement.dataset.theme = t === 'paper' ? 'paper' : 'ink'
      } catch (e) {
        document.documentElement.dataset.theme = 'ink'
      }
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #070a12;
      }
      html[data-theme='paper'],
      html[data-theme='paper'] body,
      html[data-theme='paper'] #root {
        background: #f2eee3;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        color: #8b9ac4;
        font: 500 13px/1.5 'Segoe UI', 'Microsoft YaHei', sans-serif;
        letter-spacing: 0.08em;
      }
      #boot .ring {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid #1e2740;
        border-top-color: #22d3ee;
        animation: fpspin 0.9s linear infinite;
      }
      @keyframes fpspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="ring"></div>
        <div>FASTPIG 正在装载知识库</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
